version: '3.9'

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - ALLOWED_ORIGINS=http://localhost:5173,http://localhost:4173
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - OPENF1_ACCESS_TOKEN=${OPENF1_ACCESS_TOKEN:-}
    volumes:
      - ./backend/cache:/app/cache
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  automator:
    build: ./backend
    command: python automator.py
    environment:
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
    volumes:
      - ./backend/cache:/app/cache
      - ./backend/state.json:/app/state.json
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000/api
      - VITE_WS_URL=ws://localhost:8000/ws/live
    depends_on:
      - backend
    restart: unless-stopped